basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  character.CreateInput:
    properties:
      description:
        maxLength: 255
        type: string
      image_url:
        type: string
      name:
        maxLength: 100
        type: string
      type:
        maxLength: 30
        type: string
    required:
    - description
    - name
    - type
    type: object
  character.Response:
    properties:
      character_id:
        type: integer
      description:
        type: string
      image_url:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  character.UpdateInput:
    properties:
      description:
        maxLength: 255
        type: string
      image_url:
        type: string
      name:
        maxLength: 100
        type: string
      type:
        maxLength: 30
        type: string
    type: object
  event.CreateInput:
    properties:
      banner_url:
        maxLength: 255
        type: string
      day:
        description: AAAA-MM-DD
        example: "2026-11-15"
        type: string
      description:
        maxLength: 255
        type: string
      title:
        maxLength: 75
        type: string
    required:
    - day
    - description
    - title
    type: object
  event.Response:
    properties:
      banner_url:
        type: string
      day:
        description: AAAA-MM-DD
        example: "2026-11-15"
        type: string
      description:
        type: string
      event_id:
        type: integer
      title:
        type: string
      user_id:
        type: integer
    type: object
  event.UpdateInput:
    properties:
      banner_url:
        maxLength: 255
        type: string
      day:
        description: AAAA-MM-DD
        example: "2026-11-15"
        type: string
      description:
        maxLength: 255
        type: string
      title:
        maxLength: 75
        type: string
    type: object
  guide.CreateInput:
    properties:
      banner_url:
        type: string
      character_id:
        minimum: 1
        type: integer
      description:
        maxLength: 2083
        type: string
      link:
        type: string
      title:
        maxLength: 254
        type: string
      type:
        maxLength: 15
        type: string
    required:
    - character_id
    - description
    - title
    type: object
  guide.Response:
    properties:
      banner_url:
        type: string
      character_id:
        type: integer
      creation_date:
        type: string
      description:
        type: string
      dislikes:
        type: integer
      guide_id:
        type: integer
      likes:
        type: integer
      link:
        type: string
      title:
        type: string
      type:
        type: string
      user_id:
        type: integer
    type: object
  guide.UpdateInput:
    properties:
      banner_url:
        type: string
      description:
        maxLength: 2083
        type: string
      link:
        type: string
      title:
        maxLength: 254
        type: string
      type:
        maxLength: 15
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      error:
        example: o recurso solicitado não foi encontrado
        type: string
    type: object
  httpx.PageResponse-event_Response:
    properties:
      data:
        items:
          $ref: '#/definitions/event.Response'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  httpx.PageResponse-guide_Response:
    properties:
      data:
        items:
          $ref: '#/definitions/guide.Response'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  user.CreateInput:
    properties:
      discord_id:
        type: string
      email:
        type: string
      nickname:
        maxLength: 30
        minLength: 3
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
    required:
    - email
    - nickname
    - password
    type: object
  user.PublicResponse:
    properties:
      discord_id:
        type: string
      event_count:
        type: integer
      guide_count:
        type: integer
      nickname:
        type: string
      registration_date:
        type: string
      user_id:
        type: integer
    type: object
  user.Response:
    properties:
      discord_id:
        type: string
      email:
        type: string
      event_count:
        type: integer
      guide_count:
        type: integer
      nickname:
        type: string
      registration_date:
        type: string
      user_id:
        type: integer
    type: object
  user.UpdateInput:
    properties:
      discord_id:
        type: string
      email:
        type: string
      nickname:
        maxLength: 30
        minLength: 3
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
    type: object
info:
  contact: {}
  description: API para gerenciamento de guias, eventos e personagens.
  title: Feel The Night API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica com email e senha e retorna access e refresh token.
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Login
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Troca um refresh token válido por um novo par de access e refresh
        token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Renovar tokens
      tags:
      - Auth
  /characters:
    get:
      description: Lista todos os personagens. Nome (busca parcial) e tipo são filtros
        opcionais.
      parameters:
      - description: Filtrar por nome
        in: query
        name: name
        type: string
      - description: Filtrar por tipo
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/character.Response'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Listar personagens
      tags:
      - Character
    post:
      consumes:
      - application/json
      description: Cria um novo personagem com os dados informados no corpo da requisição.
      parameters:
      - description: Dados do Personagem
        in: body
        name: character
        required: true
        schema:
          $ref: '#/definitions/character.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/character.Response'
      security:
      - BearerAuth: []
      summary: Criar um novo personagem
      tags:
      - Character
  /characters/{id}:
    delete:
      parameters:
      - description: ID do personagem
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deletar personagem por ID
      tags:
      - Character
    get:
      parameters:
      - description: ID do personagem
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.Response'
      summary: Buscar personagem por ID
      tags:
      - Character
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID do personagem
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/character.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.Response'
      security:
      - BearerAuth: []
      summary: Atualizar dados do personagem
      tags:
      - Character
  /events:
    get:
      description: Lista eventos com filtros opcionais de título e paginação.
      parameters:
      - description: Filtrar por título
        in: query
        name: title
        type: string
      - description: Só eventos futuros
        in: query
        name: upcoming
        type: boolean
      - default: 1
        description: Página
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Itens por página
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.PageResponse-event_Response'
      summary: listar eventos
      tags:
      - Event
    post:
      consumes:
      - application/json
      description: Cria um novo evento com os dados informados no corpo da requisição.
      parameters:
      - description: Dados do Evento
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/event.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/event.Response'
      security:
      - BearerAuth: []
      summary: Criar um novo evento
      tags:
      - Event
  /events/{id}:
    delete:
      parameters:
      - description: ID do evento
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deletar evento por ID
      tags:
      - Event
    get:
      parameters:
      - description: ID do evento
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.Response'
      summary: Buscar evento por ID
      tags:
      - Event
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID do evento
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/event.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.Response'
      security:
      - BearerAuth: []
      summary: Atualizar dados do evento
      tags:
      - Event
  /guides:
    get:
      description: Lista guias com paginação. O título é um filtro opcional (busca
        parcial).
      parameters:
      - description: Filtrar por título
        in: query
        name: title
        type: string
      - default: 1
        description: Página
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Itens por página
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.PageResponse-guide_Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Listar guias
      tags:
      - Guide
    post:
      consumes:
      - application/json
      description: Cria um guia com os dados informados no corpo da requisição.
      parameters:
      - description: Dados do guia
        in: body
        name: guide
        required: true
        schema:
          $ref: '#/definitions/guide.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/guide.Response'
      security:
      - BearerAuth: []
      summary: Criar um novo guia
      tags:
      - Guide
  /guides/{id}:
    delete:
      parameters:
      - description: ID do guia
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deletar guia por ID
      tags:
      - Guide
    get:
      parameters:
      - description: ID do guia
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/guide.Response'
      summary: Buscar guia por ID
      tags:
      - Guide
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID do guia
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/guide.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/guide.Response'
      security:
      - BearerAuth: []
      summary: Atualizar dados do guia
      tags:
      - Guide
  /users:
    get:
      parameters:
      - description: Email do usuário
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar usuário por email (admin)
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Cria um usuário com os dados informados no corpo da requisição.
        Todo usuário novo começa como "iniciante".
      parameters:
      - description: Dados do usuário
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Criar um novo usuário
      tags:
      - User
  /users/{id}:
    delete:
      parameters:
      - description: ID do usuário
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletar usuário por ID (admin)
      tags:
      - User
    get:
      description: Retorna o perfil público do usuário (sem email).
      parameters:
      - description: ID do usuário
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.PublicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Buscar usuário por ID
      tags:
      - User
    patch:
      consumes:
      - application/json
      description: O próprio usuário pode editar a sua conta; admin pode editar qualquer
        conta.
      parameters:
      - description: ID do usuário
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar dados do usuário
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
